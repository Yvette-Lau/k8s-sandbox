apiVersion: v1
kind: Namespace
metadata:
  name: gitops-test
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-gitops-test
  namespace: gitops-test
  labels:
    app: nginx-test
    managed-by: flux
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
